version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - nolintlint
    - noctx
    - unconvert
    - usestdlibvars
  settings:
    gosec:
      excludes: [] # add rule IDs only with a one-line rationale each
  exclusions:
    presets:
      - common-false-positives
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [gosec, errcheck, noctx]

formatters:
  enable:
    - gofmt
