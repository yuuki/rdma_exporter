name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GOFLAGS: -buildvcs=false
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race ./...

      - name: Test injected netlink replies with CAP_NET_ADMIN
        # The Execute cases that inject crafted netlink replies need
        # CAP_NET_ADMIN and skip in the unprivileged step above. Run them as
        # root, and fail rather than skip if injection is still refused.
        env:
          RDMANL_REQUIRE_INJECT: "1"
        run: go test -race -exec "sudo -E" -run 'TestExecute|TestReconnect' ./internal/rdmanl/
