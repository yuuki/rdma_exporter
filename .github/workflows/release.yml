# Release workflow for rdma_exporter, following the hannuus repo conventions.
# Builds the multi-arch Docker image and pushes it to the private hub.6scloud.com
# registry, then publishes a GitHub Release pointing at it.

name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  init-release-version:
    name: Determine release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release-version.outputs.version }}
    steps:
      - name: Initialize release version
        id: release-version
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            # For pushes under a 'v*' tag, use the tag as-is.
            case "${GITHUB_REF_NAME}" in
              v*) release_version="${GITHUB_REF_NAME}" ;;
              *)
                release_date="$(date -u +'%Y.%m.%d')"
                release_prefix="v${release_date}-rc"

                gh api --paginate "repos/${GITHUB_REPOSITORY}/tags" --jq '.[].name' > /tmp/all-tags.txt
                awk -v prefix="${release_prefix}" 'index($0, prefix) == 1' /tmp/all-tags.txt > /tmp/tags.txt

                export release_date
                release_version=$(ruby -e 'release_date=ENV["release_date"]; versions=File.readlines("/tmp/tags.txt").map(&:strip); (1..10000).each do |i| candidate="v#{release_date}-rc#{i}"; unless versions.include?(candidate); puts candidate; break; end; end')
                ;;
            esac
          else
            release_version="${GITHUB_REF_NAME}"
          fi

          echo "Calculated version: ${release_version}"
          echo "RELEASE_VERSION=${release_version}" >> "$GITHUB_ENV"
          echo "version=${release_version}" >> "$GITHUB_OUTPUT"

      - name: Echo version
        run: echo $RELEASE_VERSION

  build-image:
    name: Build and push rdma_exporter Docker image
    runs-on: ubuntu-latest
    needs: init-release-version
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: hub.6scloud.com
          username: ${{ secrets.HUB_6SCLOUD_USERNAME }}
          password: ${{ secrets.HUB_6SCLOUD_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ needs.init-release-version.outputs.version }}
            COMMIT=${{ github.sha }}
          tags: |
            hub.6scloud.com/d1r7umcsfi9c73b4drdg/rdma_exporter:latest
            hub.6scloud.com/d1r7umcsfi9c73b4drdg/rdma_exporter:${{ needs.init-release-version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  package-release:
    name: Publish release
    runs-on: ubuntu-latest
    needs:
      - init-release-version
      - build-image
    permissions:
      contents: write
    steps:
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.init-release-version.outputs.version }}
          name: ${{ needs.init-release-version.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: |
            ## Docker Image

            ```bash
            docker pull hub.6scloud.com/d1r7umcsfi9c73b4drdg/rdma_exporter:${{ needs.init-release-version.outputs.version }}
            ```
